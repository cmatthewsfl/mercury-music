<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="Cindy + Mercury music launcher">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Mercury Music</title>
  <style>
    :root{--bg:#0b0d12;--panel:#141822;--panel2:#1b2130;--text:#f7f8fb;--muted:#aab2c3;--line:#2a3142;--accent:#f4b942;--accent2:#7c9cff;--radius:22px}
    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);background:radial-gradient(circle at 15% -10%,rgba(124,156,255,.18),transparent 35%),radial-gradient(circle at 100% 0%,rgba(244,185,66,.12),transparent 28%),var(--bg)}
    .wrap{max-width:820px;margin:auto;padding:28px 18px 72px}
    header{padding:16px 4px 20px}
    .eyebrow{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:800}
    h1{font-size:clamp(2.2rem,9vw,4.5rem);line-height:.92;margin:.35rem 0 .8rem;letter-spacing:-.055em}
    .sub{color:var(--muted);font-size:1rem;max-width:36rem;line-height:1.5}
    .toolbar{position:sticky;top:0;z-index:5;backdrop-filter:blur(14px);background:rgba(11,13,18,.82);padding:12px 0 14px}
    .search{width:100%;padding:15px 17px;border-radius:16px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:1rem;outline:none}
    .search:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(124,156,255,.12)}
    .chips{display:flex;gap:8px;overflow:auto;padding:12px 1px 2px;scrollbar-width:none}
    .chips::-webkit-scrollbar{display:none}
    .chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:9px 13px;border-radius:999px;font-weight:750;white-space:nowrap;cursor:pointer}
    .chip.active{background:var(--text);color:#0b0d12;border-color:var(--text)}
    section{margin-top:24px}
    .section-head{display:flex;justify-content:space-between;align-items:end;margin:0 2px 12px}
    h2{font-size:1.02rem;margin:0;letter-spacing:.02em}
    .count{font-size:.82rem;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .card{display:flex;flex-direction:column;min-height:190px;border:1px solid var(--line);background:linear-gradient(160deg,var(--panel2),var(--panel));border-radius:var(--radius);padding:18px;text-decoration:none;color:inherit;box-shadow:0 16px 40px rgba(0,0,0,.16);transition:.18s ease}
    .card:active{transform:scale(.985)}
    .emoji{font-size:2rem;margin-bottom:28px}
    .title{font-size:1.18rem;font-weight:850;letter-spacing:-.025em}
    .desc{font-size:.88rem;line-height:1.45;color:var(--muted);margin:.45rem 0 1rem}
    .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
    .tag{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
    .play{font-size:.8rem;font-weight:850;color:var(--text)}
    .empty{display:none;padding:28px 6px;color:var(--muted)}
    footer{margin-top:42px;padding:22px 4px;color:var(--muted);font-size:.82rem;line-height:1.5}
    @media(max-width:560px){.wrap{padding:20px 14px 60px}.grid{grid-template-columns:1fr}.card{min-height:155px}.emoji{margin-bottom:18px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="eyebrow">Cindy + Mercury</div>
      <h1>Mercury Music</h1>
      <div class="sub">One door to every playlist. Search by mood, tap a card, and let YouTube take over.</div>
    </header>
    <div class="toolbar">
      <input id="search" class="search" type="search" placeholder="Search playlists…" autocomplete="off">
      <div id="chips" class="chips"></div>
    </div>
    <section id="pinnedSection">
      <div class="section-head"><h2>Pinned</h2><div id="pinnedCount" class="count"></div></div>
      <div id="pinned" class="grid"></div>
    </section>
    <section>
      <div class="section-head"><h2>All playlists</h2><div id="allCount" class="count"></div></div>
      <div id="all" class="grid"></div>
      <div id="empty" class="empty">No playlist matches that search.</div>
    </section>
    <footer>Built to grow with the tree. New playlists can be added without changing the layout.</footer>
  </main>
  <script src="playlists.js"></script>
  <script>
    const playlists=window.MERCURY_PLAYLISTS||[],search=document.querySelector('#search'),chips=document.querySelector('#chips'),pinnedEl=document.querySelector('#pinned'),allEl=document.querySelector('#all'),empty=document.querySelector('#empty'),pinnedSection=document.querySelector('#pinnedSection');let activeCategory='All';
    const categories=['All',...new Set(playlists.map(p=>p.category))];
    function makeCard(p){const a=document.createElement('a');a.className='card';a.href=p.url;a.target='_blank';a.rel='noopener';a.innerHTML=`<div class="emoji">${p.emoji||'🎵'}</div><div class="title">${p.title}</div><div class="desc">${p.description||''}</div><div class="meta"><div class="tag">${p.category||'Playlist'}</div><div class="play">PLAY ↗</div></div>`;return a}
    function renderChips(){chips.innerHTML='';categories.forEach(cat=>{const b=document.createElement('button');b.className='chip'+(cat===activeCategory?' active':'');b.textContent=cat;b.addEventListener('click',()=>{activeCategory=cat;renderChips();render()});chips.appendChild(b)})}
    function render(){const q=search.value.trim().toLowerCase();const filtered=playlists.filter(p=>{const hay=[p.title,p.description,p.category,...(p.tags||[])].join(' ').toLowerCase();return (activeCategory==='All'||p.category===activeCategory)&&hay.includes(q)});const pins=filtered.filter(p=>p.pinned);pinnedEl.innerHTML='';allEl.innerHTML='';pins.forEach(p=>pinnedEl.appendChild(makeCard(p)));filtered.forEach(p=>allEl.appendChild(makeCard(p)));pinnedSection.style.display=pins.length?'':'none';empty.style.display=filtered.length?'none':'block';document.querySelector('#pinnedCount').textContent=pins.length?String(pins.length):'';document.querySelector('#allCount').textContent=String(filtered.length)}
    search.addEventListener('input',render);renderChips();render();
    if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
  </script>
</body>
</html>
